name: macOS beta checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install fixture dependency
        run: brew install tmux
      - name: Swift build and headless tests
        # Several suites intentionally exercise process-global tmux, locale, and
        # observation state. Explicit serialization prevents cross-test fixtures
        # from impersonating live agents or delaying heartbeat transitions.
        run: swift test --no-parallel
      - name: Build session helper
        # The registration CLI tests drive .build/debug/focus-queue-session,
        # which swift test does not necessarily produce.
        run: swift build
      - name: Python tests
        # Installed launchers and the installer use Apple's Python, rather than
        # whichever Homebrew Python happens to be first on a runner's PATH.
        run: /usr/bin/python3 -m unittest discover -s Tests -p 'test_*.py'
      - name: Shell syntax
        run: zsh -n Scripts/build-app.sh Scripts/install.sh Scripts/uninstall.sh Scripts/package-release.sh
      - name: Package unsigned CI smoke artifact
        if: github.ref == 'refs/heads/main'
        env:
          # Hosted CI has no publisher key. This artifact exercises packaging;
          # the updater rejects it, and signed release packaging stays required.
          FOCUS_QUEUE_ALLOW_UNSIGNED_RELEASE: "1"
        run: zsh Scripts/package-release.sh
      - name: Package signed private beta
        if: startsWith(github.ref, 'refs/tags/')
        run: zsh Scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ github.ref == 'refs/heads/main' && 'macOS-ci-smoke-unsigned' || 'macOS-private-beta' }}
          path: |
            dist/*-beta-*.zip
            dist/*-beta-*.sha256
            dist/*-beta-*.zip.sig
